# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# See kos/decisions/rails-activejob-solid-queue-for-background-work.md and
# kos/decisions/seat-hold-ttl.md. NOTE: Solid Queue's config loader uses ONLY the block matching
# the current Rails.env if one exists at the top level -- it does not merge a top-level task with
# an env-scoped sibling. release_expired_seat_holds must be listed explicitly under every
# environment that should run it, not added as a bare top-level key.
development:
  release_expired_seat_holds:
    class: ReleaseExpiredSeatHoldsJob
    schedule: every minute

production:
  release_expired_seat_holds:
    class: ReleaseExpiredSeatHoldsJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
